version: '3.8'

services:
  careershield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careershield-mail-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CORS_ORIGINS=*
      - CAREERSHIELD_DB_PATH=/app/data/careershield_store.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
